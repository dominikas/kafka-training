server:
  port: 8085

spring:
  application:
    name: kafka-consumer
  kafka:
    topic-name: order_topic_test
    consumer:
      group-id: kafka-training-consumer-${random.uuid}
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
  datasource:
    name: customer-database
    url: jdbc:tc:postgresql:9.6.8:///customer-database
    username: postgres
    password: postgres
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true

logging:
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]'
  include-application-name: false
management:
  tracing:
    sampling:
      probability: 1.0
  metrics:
    data:
      repository:
        autotime:
          enabled: true
  datadog:
    metrics:
      export:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

